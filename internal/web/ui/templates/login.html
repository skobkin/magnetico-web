{{define "title"}}Sign in{{end}}
{{define "content"}}
<h1>Sign in</h1>
{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/login">
{{template "csrf" .CSRFToken}}
{{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
<p><label>Username<br><input type="text" name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" required maxlength="100"></label></p>
<p><label>Password<br><input type="password" name="password" autocomplete="current-password" required></label></p>
<p><label><input type="checkbox" name="remember" value="1"{{if .Remember}} checked{{end}}> Keep me signed in on this device</label></p>
<p><button type="submit">Sign in</button></p>
</form>
{{end}}
