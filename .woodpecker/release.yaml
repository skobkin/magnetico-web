# Release workflow: publication of a release tag (MAJOR.MINOR.PATCH or
# MAJOR.MINOR.PATCH-rc.N). Nothing else triggers it.
#
# It waits for the verification workflow (ci.yaml) of the same tag: every gate (tests,
# race suite, lint, govulncheck, ...) has passed before anything below starts. It is the
# conventional shape of the project's other repositories:
#
#   release-forgejo  GoReleaser builds the linux/amd64 and linux/arm64 archives and creates
#                    the Forgejo release (prerelease for a tag with an -rc.N part; the
#                    changelog is the release notes).
#   release-docker   the Woodpecker buildx plugin builds the multi-architecture image and
#                    pushes it to docker.io/skobkin/magnetico-web and
#                    ghcr.io/skobkin/magnetico-web under exactly the release tag.
#                    `latest` is never applied: the owner enables it deliberately (a
#                    second tags entry, with internal/repocheck updated).
#
# Secrets (Woodpecker, restricted to the tag event and this repository on the server;
# see docs/release-engineering.md): GITEA_TOKEN (release-forgejo only) and DOCKER_LOGIN,
# DOCKER_TOKEN, GHCR_LOGIN, GHCR_TOKEN (release-docker only). No pull-request workflow can
# reach them. No registry cache is configured.
when:
  - event: tag
    evaluate: 'CI_COMMIT_TAG matches "^[0-9]+[.][0-9]+[.][0-9]+(-rc[.][0-9]+)?$"'

depends_on:
  - ci

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  - name: release-forgejo
    image: goreleaser/goreleaser:v2.20.1
    environment:
      # The image ships Go 1.27.3 with GOTOOLCHAIN=local, which silently ignores
      # go.mod's toolchain line: the security floor is enforced explicitly.
      GOTOOLCHAIN: go1.27.4+auto
      GITEA_TOKEN:
        from_secret: GITEA_TOKEN
    commands:
      - test -n "$CI_FORGE_URL" || (echo "CI_FORGE_URL is empty. Cannot derive the Forgejo URLs." && exit 1)
      - goreleaser release --clean

  # 'woodpeckerci/plugin-docker-buildx:6' must be listed in WOODPECKER_PLUGINS_PRIVILEGED on
  # the Woodpecker server. The plugin's automatic labels are off: they would replace the
  # Dockerfile's org.opencontainers.image.source (the GitHub mirror, which links the GHCR
  # package to the repository) with the Forgejo URL.
  - name: release-docker
    image: woodpeckerci/plugin-docker-buildx:6
    settings:
      repo:
        - skobkin/magnetico-web
        - ghcr.io/skobkin/magnetico-web
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      pull_image: true
      default_labels: false
      sbom: true
      provenance: mode=max
      tags:
        - ${CI_COMMIT_TAG}
      build_args:
        - VERSION=${CI_COMMIT_TAG}
        - COMMIT=${CI_COMMIT_SHA}
      logins:
        - registry: https://index.docker.io/v1/
          username:
            from_secret: DOCKER_LOGIN
          password:
            from_secret: DOCKER_TOKEN
        - registry: https://ghcr.io
          username:
            from_secret: GHCR_LOGIN
          password:
            from_secret: GHCR_TOKEN
