# Verification workflow: every gate of the project runs here: format, lint, vet, build, the
# test suite against a disposable PostgreSQL 17, govulncheck, OpenAPI consistency, the
# Dockerfile lint, a snapshot build of the native archives with their smoke test and the
# frontend self-tests for every pull request; the migration end-to-end tests and the
# race-enabled suite where they matter (see the steps' when).
#
# It holds NO secrets, uses NO privileged execution and never touches a registry:
# pull-request code runs here. Publication lives in release.yaml (tags only), which
# depends on this workflow. What cannot run here safely (building and running the
# container image needs a privileged Docker daemon) is listed in
# docs/release-engineering.md.
#
# Events:
#   push          master only. Every other branch is verified by its pull request alone, so
#                 no branch gets two pipelines (owner decision).
#   pull_request  always, never restricted: merged-state verification is kept (see the
#                 merge-target step).
#   tag           release tags only (MAJOR.MINOR.PATCH, any suffix): release.yaml waits for it.
#   manual        on demand: the full set, race suite included; not a manual run that sets
#                 FORCE_REBUILD, which is a forced image rebuild (rebuild.yaml) only.
# Scheduled checks live in security.yaml (govulncheck and a scan of the published image).
#
# What a pull request runs, and what only master, tags and manual runs add:
#   every event       merge-target, fmt, lint, vet, build, dockerfile-lint, frontend-selftest,
#                     test, govulncheck, openapi, native-snapshot, native-smoke,
#                     workflow-invariants
#   + race            master, tags and manual runs only (it repeats the whole suite under -race)
# The migration end-to-end tests run inside test outside pull requests; a pull request
# skips them there and runs them in migration-e2e only when it changes the migration code
# or what it is built on (the step's path filter).
when:
  - event: push
    branch: master
  - event: pull_request
  - event: manual
    evaluate: 'FORCE_REBUILD != "true"'
  - event: tag
    evaluate: 'CI_COMMIT_TAG matches "^[0-9]+[.][0-9]+[.][0-9]+"'

# The plugin's default clone: one commit (partial, which overrides depth with 1). Only
# merge-target needs history, and only for a pull request: it fetches it there.
clone:
  git:
    image: woodpeckerci/plugin-git

services:
  # Disposable server of the integration tests. The test harness derives role DSNs
  # without a password, so the server uses trust authentication; it is reachable only
  # on the pipeline's private network.
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

steps:
  # Pull requests: test the merged state (target branch + the pull request), not the
  # pull request alone. A conflict fails the pipeline. For every other event this
  # step does nothing. (A private repository needs the clone credentials here too.)
  - name: merge-target
    image: alpine/git:v2.54.1
    commands:
      - |
        if [ "$CI_PIPELINE_EVENT" != "pull_request" ]; then
          echo "not a pull request: nothing to merge"
          exit 0
        fi
        git config --global --add safe.directory "$CI_WORKSPACE"
        git config user.email ci@woodpecker.invalid
        git config user.name woodpecker
        # The clone is a single commit: fetch the history, or the merge finds no merge base
        # ("refusing to merge unrelated histories").
        if git rev-parse --is-shallow-repository | grep -qx true; then
          git fetch --no-tags --unshallow origin
        fi
        git fetch --no-tags origin "$CI_COMMIT_TARGET_BRANCH"
        git merge --no-edit FETCH_HEAD
        git log -1 --oneline

  - name: fmt
    image: golangci/golangci-lint:v2.15-alpine
    depends_on: [merge-target]
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - golangci-lint fmt --diff ./...

  - name: lint
    image: golangci/golangci-lint:v2.15-alpine
    depends_on: [merge-target]
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - golangci-lint run ./...

  - name: vet
    image: golang:1.27.4-alpine
    depends_on: [merge-target]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - go vet ./...
      # The opt-in code (benchmark harness, diagnostic listener) must stay compilable.
      - go vet -tags loadtest,diag ./...

  - name: build
    image: golang:1.27.4-alpine
    depends_on: [merge-target]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - CGO_ENABLED=0 go build -trimpath -o /tmp/magnetico ./cmd/magnetico
      - /tmp/magnetico --version

  - name: wait-postgres
    image: postgres:17-alpine
    depends_on: [merge-target]
    commands:
      - sh ci/wait-postgres.sh postgres 5432 60

  # The whole suite (unit, PostgreSQL integration, real-binary end-to-end, security
  # regression, fault injection, fuzz seed corpora). A pull request skips the migration
  # end-to-end tests here; migration-e2e runs them when the pull request needs them (the
  # -skip pattern here and its -run pattern are the same, so no test falls between them). -p 3 is the verified configuration
  # (docs/engineering-standards.md); at the default parallelism the timing-sensitive tests
  # of issues #52/#53 are unreliable on a busy host. -timeout 20m: one package
  # (internal/e2e/cli) takes 6 to 10 minutes alone, close to go test's default of 10.
  # MAGNETICO_TEST_REQUIRE_POSTGRES=1 makes an unreachable database a failure, and
  # skipcensus fails the run when any test was skipped for a reason that is not on
  # ci/skip-allowlist.txt: a green run cannot be a run of silently skipped tests.
  - name: test
    image: golang:1.27.4-alpine
    # Runs alone on the agent: -p 3 is verified for that condition, and failures are
    # never rerun, so lint, vet, build and the Dockerfile check finish first.
    depends_on: [wait-postgres, fmt, lint, vet, build, dockerfile-lint]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
      MAGNETICO_TEST_POSTGRES_DSN: postgres://postgres@postgres:5432/postgres?sslmode=disable
      MAGNETICO_TEST_REQUIRE_POSTGRES: "1"
    commands:
      # ci/go-test.sh: live per-package progress in the log, the whole JSON stream kept
      # in /tmp/test.json for the census, a summary of every failure, go test's status.
      - |
        if [ "$CI_PIPELINE_EVENT" = "pull_request" ]; then
          sh ci/go-test.sh test -p 3 -count=1 -timeout 20m -skip '^(TestFault|TestImportWithReadOnlySourceRole|TestMigrateTorrentsBinarySmoke|TestMigrateVerifyRetryBinarySmoke|TestMigrateExportCleanupBinarySmoke)' ./...
        else
          sh ci/go-test.sh test -p 3 -count=1 -timeout 20m ./...
        fi
      - go run ./ci/skipcensus --allow ci/skip-allowlist.txt < /tmp/test.json

  # The end-to-end tests of the offline migrator (crash and resume, lost commits, source
  # drift, lock exclusion, the binary smoke tests): the slowest tests of the suite, and
  # only migration code and what it is built on can change their outcome. A pull request
  # runs them here, only when such a path changes; every other event runs them inside
  # test (master runs them after the merge either way). They run after everything else of
  # the pull request, alone on the agent. Nothing depends on this step. The -run pattern
  # is the test step's -skip pattern.
  - name: migration-e2e
    image: golang:1.27.4-alpine
    depends_on: [test, govulncheck, openapi, native-smoke, workflow-invariants, frontend-selftest]
    when:
      - event: pull_request
        path:
          include:
            - 'internal/migration/**'
            - 'internal/app/**'
            - 'cmd/magnetico/**'
            - 'opflags/**'
            - 'persistence/**'
            - 'codec/**'
            - 'internal/pgtest/**'
            - 'internal/testkit/**'
            - 'internal/e2e/cli/migrate_*'
            - 'internal/e2e/cli/pgmain_test.go'
            - 'go.mod'
            - 'go.sum'
            - '.woodpecker/ci.yaml'
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
      MAGNETICO_TEST_POSTGRES_DSN: postgres://postgres@postgres:5432/postgres?sslmode=disable
      MAGNETICO_TEST_REQUIRE_POSTGRES: "1"
    commands:
      - sh ci/go-test.sh migration -p 3 -count=1 -timeout 20m -run '^(TestFault|TestImportWithReadOnlySourceRole|TestMigrateTorrentsBinarySmoke|TestMigrateVerifyRetryBinarySmoke|TestMigrateExportCleanupBinarySmoke)' ./internal/e2e/cli
      - go run ./ci/skipcensus --allow ci/skip-allowlist.txt < /tmp/migration.json

  # The whole suite under the race detector: pushes to master, tags (a release waits for
  # it) and manual runs, never a pull request (owner decision: it doubles the
  # pipeline). It runs last, alone on the agent: -p 3 is verified for a suite that has
  # the agent to itself. Nothing depends on it, so leaving it out of a pull request
  # leaves no step waiting. Failures are never rerun.
  - name: race
    image: golang:1.27.4-trixie
    depends_on: [test, govulncheck, openapi, native-smoke, workflow-invariants, frontend-selftest]
    when:
      - event: [push, tag, manual]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
      MAGNETICO_TEST_POSTGRES_DSN: postgres://postgres@postgres:5432/postgres?sslmode=disable
      MAGNETICO_TEST_REQUIRE_POSTGRES: "1"
    commands:
      - sh ci/go-test.sh race -race -p 3 -count=1 -timeout 20m ./...
      - go run ./ci/skipcensus --allow ci/skip-allowlist.txt < /tmp/race.json

  # Known vulnerabilities of the code and its dependencies (the pinned checker is run by
  # the toolchain of the step: a checker built by an older Go cannot analyse this code).
  - name: govulncheck
    image: golang:1.27.4-alpine
    depends_on: [test]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
      GOTOOLCHAIN: local
    commands:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -tags loadtest,diag ./...

  # The OpenAPI documents are validated by the existing tests (the document itself,
  # and the real binary's responses against it); named separately for visibility.
  - name: openapi
    image: golang:1.27.4-alpine
    depends_on: [test]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
      MAGNETICO_TEST_POSTGRES_DSN: postgres://postgres@postgres:5432/postgres?sslmode=disable
      MAGNETICO_TEST_REQUIRE_POSTGRES: "1"
    commands:
      - go test -count=1 ./internal/web/apidocs/...
      - go test -count=1 -run OpenAPI ./internal/e2e/cli

  # A snapshot build of the native archives (no tag, no upload, no secrets) and its smoke
  # test: checksums, licences, the embedded assets, the build settings. The GoReleaser image
  # ships Go 1.27.3 with GOTOOLCHAIN=local, which would silently ignore go.mod's toolchain
  # line: the floor is enforced explicitly.
  - name: native-snapshot
    image: goreleaser/goreleaser:v2.20.1
    depends_on: [test]
    environment:
      GOTOOLCHAIN: go1.27.4+auto
    commands:
      - goreleaser check
      - goreleaser release --snapshot --clean --skip=publish
      - (cd dist && sha256sum -c checksums.txt)

  - name: native-smoke
    image: golang:1.27.4-alpine
    depends_on: [native-snapshot]
    environment:
      GOFLAGS: -buildvcs=false
    commands:
      - sh ci/native-smoke.sh dist

  # The self-tests of the administrator charts' JavaScript (internal/web/ui/jstest): plain
  # Node, no package and no build; Node is used here only and never in a build of the
  # product. Run under three browser time zones; EXPECT_TZ_OFFSET fails a run whose image
  # does not really apply the zone.
  - name: frontend-selftest
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    depends_on: [merge-target]
    commands:
      - node internal/web/ui/jstest/admin_test.js
      - TZ=America/Los_Angeles EXPECT_TZ_OFFSET=480 node internal/web/ui/jstest/admin_test.js
      - TZ=Pacific/Kiritimati EXPECT_TZ_OFFSET=-840 node internal/web/ui/jstest/admin_test.js

  - name: dockerfile-lint
    image: hadolint/hadolint:v2.14.0-alpine
    depends_on: [merge-target]
    commands:
      - hadolint Dockerfile

  # The workflow files' own security invariants and the CI tools' tests. The tests of the
  # rebuild and scan scripts need git and jq (absent from the image, so the test step skips
  # them); here they are installed and REPOCHECK_REQUIRE_TOOLS=1 makes a missing one fail.
  - name: workflow-invariants
    image: golang:1.27.4-alpine
    depends_on: [test]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
      REPOCHECK_REQUIRE_TOOLS: "1"
    commands:
      - apk add --no-cache git jq
      - go test -count=1 ./internal/repocheck ./ci/...
