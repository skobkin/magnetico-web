# Placeholder pipeline for the unified Go project (Magnetico 0.8.0).
# To be adapted properly in a later task; publishing stays disabled until then.
# Docker publish secrets below are kept for reuse once the Go images are ready.
when:
  - event: [push, tag]

steps:
  build-and-test:
    image: golang:1.27-alpine
    commands:
      # cgo (go-sqlite3) + libzmq (zmq4); when this pipeline is rewritten,
      # drop the cgo deps (build-base) if the SQLite storage driver is gone by then
      - apk add --no-cache build-base pkgconf zeromq-dev
      - go build ./...
      - go test ./...

