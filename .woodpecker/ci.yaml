# Verification workflow: lint, vet, build, the whole test suite against a disposable
# PostgreSQL 17, OpenAPI consistency, GoReleaser and Dockerfile checks.
#
# It runs for pull requests, pushes to the default branch and to the active 0.8.0
# development branch, release tags and manual runs. It holds NO secrets, uses NO
# privileged execution and never touches a registry: pull-request code runs here.
# Publication lives in release.yaml, which depends on this workflow.
#
# Events:
#   push          master and the 0.8.0 branch only (remove the branch after the 0.8.0
#                 merge). Every other branch is verified by its pull request alone, so
#                 a feature branch does not get two pipelines.
#   pull_request  always, never restricted: merged-state verification is kept (see the
#                 merge-target step). While a pull request from the 0.8.0 branch is
#                 open that branch has a push and a pull-request pipeline: the one
#                 accepted duplication.
#   tag           release tags only (MAJOR.MINOR.PATCH[-rc.N]).
#   manual        on demand (also the base of a manual release pre-flight).
when:
  - event: push
    branch:
      - master
      - refactor/0.8.0-unify-and-new-storage
  - event: pull_request
  - event: manual
  - event: tag
    evaluate: 'CI_COMMIT_TAG matches "^[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$"'

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

services:
  # Disposable server of the integration tests. The test harness derives role DSNs
  # without a password, so the server uses trust authentication; it is reachable only
  # on the pipeline's private network.
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

steps:
  # Pull requests: test the merged state (target branch + the pull request), not the
  # pull request alone. A conflict fails the pipeline. For every other event this
  # step does nothing. (A private repository needs the clone credentials here too.)
  - name: merge-target
    image: alpine/git:v2.54.1
    commands:
      - |
        if [ "$CI_PIPELINE_EVENT" != "pull_request" ]; then
          echo "not a pull request: nothing to merge"
          exit 0
        fi
        git config --global --add safe.directory "$CI_WORKSPACE"
        git config user.email ci@woodpecker.invalid
        git config user.name woodpecker
        git fetch --no-tags origin "$CI_COMMIT_TARGET_BRANCH"
        git merge --no-edit FETCH_HEAD
        git log -1 --oneline

  - name: fmt
    image: golangci/golangci-lint:v2.15-alpine
    depends_on: [merge-target]
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - golangci-lint fmt --diff ./...

  - name: lint
    image: golangci/golangci-lint:v2.15-alpine
    depends_on: [merge-target]
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - golangci-lint run ./...

  - name: vet
    image: golang:1.27.4-alpine
    depends_on: [merge-target]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - go vet ./...
      # The opt-in code (benchmark harness, diagnostic listener) must stay compilable.
      - go vet -tags loadtest,diag ./...

  - name: build
    image: golang:1.27.4-alpine
    depends_on: [merge-target]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - CGO_ENABLED=0 go build -trimpath -o /tmp/magnetico ./cmd/magnetico
      - /tmp/magnetico --version

  - name: wait-postgres
    image: postgres:17-alpine
    depends_on: [merge-target]
    commands:
      - sh ci/wait-postgres.sh postgres 5432 60

  # The whole suite (unit, PostgreSQL integration, real-binary end-to-end, security
  # regression, fault injection, fuzz seed corpora). -p 3 is the verified
  # configuration (docs/engineering-standards.md); at the default parallelism the
  # timing-sensitive tests of issues #52/#53 are unreliable on a busy host.
  # MAGNETICO_TEST_REQUIRE_POSTGRES=1 makes an unreachable database a failure, and
  # skipcensus fails the run when any test was skipped for a reason that is not on
  # ci/skip-allowlist.txt: a green run cannot be a run of silently skipped tests.
  - name: test
    image: golang:1.27.4-alpine
    # Runs alone on the agent: -p 3 is verified for that condition, and failures are
    # never rerun, so lint, vet, build and the Dockerfile check finish first.
    depends_on: [wait-postgres, fmt, lint, vet, build, dockerfile-lint]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
      MAGNETICO_TEST_POSTGRES_DSN: postgres://postgres@postgres:5432/postgres?sslmode=disable
      MAGNETICO_TEST_REQUIRE_POSTGRES: "1"
    commands:
      - |
        go test -p 3 -count=1 -json ./... > /tmp/test.json || {
          echo "go test failed; failures:"
          go run ./ci/skipcensus --failures < /tmp/test.json
          exit 1
        }
      - go run ./ci/skipcensus --allow ci/skip-allowlist.txt < /tmp/test.json

  # The OpenAPI documents are validated by the existing tests (the document itself,
  # and the real binary's responses against it); named separately for visibility.
  - name: openapi
    image: golang:1.27.4-alpine
    depends_on: [test]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
      MAGNETICO_TEST_POSTGRES_DSN: postgres://postgres@postgres:5432/postgres?sslmode=disable
      MAGNETICO_TEST_REQUIRE_POSTGRES: "1"
    commands:
      - go test -count=1 ./internal/web/apidocs/...
      - go test -count=1 -run OpenAPI ./internal/e2e/cli

  # A snapshot build of the native archives (no tag, no upload, no secrets). The
  # GoReleaser image ships Go 1.27.3 with GOTOOLCHAIN=local, which would silently
  # ignore go.mod's toolchain line: the floor is enforced explicitly.
  - name: release-dry-run
    image: goreleaser/goreleaser:v2.20.1
    depends_on: [test]
    environment:
      GOTOOLCHAIN: go1.27.4+auto
    commands:
      - goreleaser check
      - goreleaser release --snapshot --clean --skip=publish
      - (cd dist && sha256sum -c checksums.txt)

  # The self-tests of the administrator charts' JavaScript (internal/web/ui/jstest): plain
  # Node, no package and no build; Node is used here only and never in a build of the
  # product. Run under three browser time zones; EXPECT_TZ_OFFSET fails a run whose image
  # does not really apply the zone.
  - name: frontend-selftest
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    depends_on: [merge-target]
    commands:
      - node internal/web/ui/jstest/admin_test.js
      - TZ=America/Los_Angeles EXPECT_TZ_OFFSET=480 node internal/web/ui/jstest/admin_test.js
      - TZ=Pacific/Kiritimati EXPECT_TZ_OFFSET=-840 node internal/web/ui/jstest/admin_test.js

  - name: dockerfile-lint
    image: hadolint/hadolint:v2.14.0-alpine
    depends_on: [merge-target]
    commands:
      - hadolint Dockerfile

  # The workflow files' own security invariants and the CI tools' tests.
  - name: workflow-invariants
    image: golang:1.27.4-alpine
    depends_on: [test]
    environment:
      GOCACHE: /tmp/.gocache
      GOFLAGS: -buildvcs=false
    commands:
      - go test -count=1 ./internal/repocheck ./ci/...
